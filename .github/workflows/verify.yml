name: Test, build, and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # Superseded pull-request runs are cancelled; main-branch releases finish so
  # a deployment in flight is never interrupted by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  simulation:
    # Native checks, then the performance benchmarks and the scalar/SIMD
    # bit-for-bit comparison, off the browser job's critical path.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --release --locked
      - name: Debug-profile tests keep integer overflow and debug assertions armed
        run: cargo test --workspace --locked
      - name: Verify every campaign solution
        run: cargo run --release --locked -p celestial-sim --bin sculptor -- verify > scenario-results.json
      - name: Sweep seeded gameplay outcomes
        run: cargo run --release --locked -p celestial-sim --bin sculptor -- sweep > sweep-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: simulation-results
          path: |
            scenario-results.json
            sweep-results.json
      - run: npm ci --ignore-scripts
      - name: Cache wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: bindgen-${{ runner.os }}-0.2.104
      - if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: npm run build
      - run: npm run bench
      - name: Compare scalar and SIMD physics and throughput
        run: npm run bench:simd
      - run: npm run bench:gravity
      - run: npm run bench:tuning
      - run: npm run bench:scaling
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-results
          path: |
            benchmark-results.json
            gravity-benchmark-results.json
            tree-tuning-results.json
            scaling-benchmark-results.json
            simd-benchmark-results.json
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/audit-design.mjs
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - name: Cache wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: bindgen-${{ runner.os }}-0.2.104
      - if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-debug-symbols
          path: target/browser-symbols/celestial_wasm_bg.wasm
          retention-days: 14
      - run: cargo clippy -p celestial-sim --lib --target wasm32-unknown-unknown --locked -- -D warnings
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gpu-compute-results
          path: |
            test-results/**/gpu-comparison.json
            test-results/**/gpu-orbits.json
            test-results/**/gpu-mixed.json
            test-results/**/gpu-lifetime.json
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-previews
          path: test-results/**/review-*.png
          retention-days: 14
      - name: Keep the browser run report, including which tests needed a retry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-report
          path: test-results/browser-report.json
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results
            test-results-gpu
            playwright-report
      - run: npm run qualify:devices -- dist/build-info.json
      - run: npm run report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-report
          path: |
            release-report.json
            device-qualification.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  arm64:
    name: Apple Silicon physics and WebKit
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: arm64
          cache: npm
      - name: Require a native ARM64 runner
        run: node -e "require('node:assert/strict').equal(process.arch, 'arm64')"
      - run: npm ci --ignore-scripts
      - name: Cache ARM64 wasm-bindgen CLI
        id: bindgen-arm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.104
      - if: steps.bindgen-arm-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: cargo test --workspace --release --locked
      - run: npm run build
      - run: npm test
      - name: Compare scalar and SIMD on ARM64
        run: npm run bench:simd
      - run: npm run bench:gravity
      - run: npm run bench:tuning
      - run: npm run bench:scaling
      - run: npx playwright install webkit chromium
      - name: Probe hardware WebGPU when the ARM64 runner exposes an adapter
        run: npx playwright test --project=gpu-metal --output=test-results-gpu
      - name: Execute recipes in ARM64 WebKit
        run: npx playwright test --project=webkit-engine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: arm64-performance-and-browser-results
          path: |
            simd-benchmark-results.json
            gravity-benchmark-results.json
            tree-tuning-results.json
            scaling-benchmark-results.json
            test-results
            test-results-gpu
            playwright-report
          retention-days: 14
  numerical-qualification:
    name: 600-year and independent numerical qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: python3 -m venv .qualification-env
      - run: .qualification-env/bin/pip install -r scripts/qualification-requirements.txt
      - run: node scripts/qualify-numerics.mjs numerics
        env:
          QUALIFICATION_PYTHON: .qualification-env/bin/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: long-run-numerical-evidence
          path: |
            numerical-raw.json
            numerical-qualification.json
          retention-days: 30
  long-run:
    # Each 600-year run on its own machine, as the shipped SIMD WebAssembly
    # under V8; the qualification job gates them.
    name: 600-year ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { run: tree, example: qualify-tree, args: tree, output: tree-raw-tree.json }
          - { run: exact, example: qualify-tree, args: exact, output: tree-raw-exact.json }
          - { run: split-tree, example: qualify-split, args: 600 split-tree, output: split-raw-split-tree.json }
          - { run: split-direct, example: qualify-split, args: 600 split-direct, output: split-raw-split-direct.json }
          - { run: uniform-tree, example: qualify-split, args: 600 uniform-tree, output: split-raw-uniform-tree.json }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: long-run
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/qualify-run.mjs ${{ matrix.example }} ${{ matrix.args }} > ${{ matrix.output }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: long-run-${{ matrix.run }}
          path: ${{ matrix.output }}
          retention-days: 30
  qualification:
    name: 600-year tree and near/far split qualification
    needs: long-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: long-run-*
          merge-multiple: true
      - run: node scripts/qualify-tree.mjs tree-raw-tree.json tree-raw-exact.json
      - run: node scripts/qualify-split.mjs split-raw-split-tree.json split-raw-split-direct.json split-raw-uniform-tree.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: long-run-qualification
          path: |
            tree-qualification.json
            split-qualification.json
          retention-days: 30
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [simulation, web, arm64, numerical-qualification, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify published entrypoint and WASM
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/smoke-deployed.mjs
